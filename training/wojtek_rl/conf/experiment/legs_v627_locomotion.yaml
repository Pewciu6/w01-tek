# @package _global_
# First locomotion run on the v6.27 legs: the `locomotion` recipe (stand <->
# walk <-> trot by commanded speed, commanded stance height) with the
# lengths moved to the longer legs. Nothing here has been trained yet, so
# read every number as a starting point. The gait clock is slowed by the
# square root of the leg-length ratio, the way a pendulum slows.
# Usage: ./run.sh train +experiment=legs_v627_locomotion
defaults:
  - override /task: joystick
  - override /robot: legs_v627

task:
  env:
    # Pose and standing rewards compare against where the joints really
    # are at each height, not against the targets. The legs sag 0.13 rad at
    # the knee crank under the robot's weight, which the target-based
    # reference would count as an error the policy cannot remove.
    real_pose_ref: true
    command:
      vx: [-0.8, 1.2]
      vy: [-0.5, 0.5]
      wz: [-1.0, 1.0]
      height: [0.28, 0.37]
      zero_prob: 0.15
    gait:
      freq: [0.9, 2.0]
      swing_height: 0.07
      trot_band: [0.5, 0.8]
    push:
      vel: 0.5

ppo:
  num_timesteps: 300000000

run_name: wojtek_legs_v627_loco_v1
